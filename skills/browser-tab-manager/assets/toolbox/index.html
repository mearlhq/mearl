<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>标签管理</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section class="overview" aria-label="标签页概览">
        <div class="summary">
          <div class="metric"><span id="tab-count-label">标签页</span><strong id="tab-count">—</strong></div>
          <div class="metric"><span id="mearl-count-label">Mearl 标签</span><strong id="mearl-count">—</strong></div>
        </div>
        <button id="refresh" type="button" class="icon-button" aria-label="刷新" title="刷新">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.3 6.7" />
            <path d="M20 4v7h-7" />
          </svg>
        </button>
      </section>

      <section class="actions" aria-label="快捷操作">
        <article>
          <span class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 2 2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2Z" />
            </svg>
          </span>
          <div class="action-copy"><h2 id="group-title">智能分组</h2><p id="group-hint">临时调用一次 Agent，根据标题和网址整理标签页</p></div>
          <button id="group" type="button" class="primary"><span id="group-label">智能分组</span><span class="spinner" aria-hidden="true"></span></button>
        </article>
        <article>
          <span class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="5" width="16" height="15" rx="2" />
              <path d="M4 9h16" />
              <path d="m10 13 4 4m0-4-4 4" />
            </svg>
          </span>
          <div class="action-copy"><h2 id="close-title">关闭 Mearl 标签</h2><p id="close-hint">关闭带 Mearl 图标或当前受控的网页</p></div>
          <button id="close" type="button" class="danger">关闭 Mearl 标签</button>
        </article>
      </section>
      <section id="groups" class="groups" aria-labelledby="groups-title" hidden>
        <h2 id="groups-title">当前分组</h2>
        <ul id="groups-list"></ul>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>

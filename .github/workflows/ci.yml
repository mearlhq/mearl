name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npx --yes --package=node@20.18.0 -- node scripts/verify-node-runtime.mjs
      - run: pnpm typecheck
      - run: pnpm check:skills
      - run: pnpm check:preset-browser
      - run: pnpm check:core-browser
      - name: Smoke test the built Chrome extension
        run: |
          url=$(curl --fail --silent --show-error --retry 3 https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json | jq --exit-status --raw-output '.channels.Stable.downloads.chrome[] | select(.platform == "linux64").url')
          curl --fail --silent --show-error --retry 3 "$url" -o "$RUNNER_TEMP/chrome-for-testing.zip"
          unzip -q "$RUNNER_TEMP/chrome-for-testing.zip" -d "$RUNNER_TEMP/chrome-for-testing"
          chrome_dir="$RUNNER_TEMP/chrome-for-testing/chrome-linux64"
          sudo install -o root -g root -m 4755 "$chrome_dir/chrome_sandbox" "$RUNNER_TEMP/chrome-sandbox"
          CHROME_DEVEL_SANDBOX="$RUNNER_TEMP/chrome-sandbox" node scripts/smoke-chrome-extension.mjs "$chrome_dir/chrome"
      - run: pnpm test --maxWorkers=2

  windows-commands:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Windows batch commands
        run: pnpm --filter @mearl/daemon-core test src/__tests__/command.test.ts -t "Windows batch commands"

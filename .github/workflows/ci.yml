name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx --yes --package=node@20.18.0 -- node scripts/verify-node-runtime.mjs
      - run: pnpm typecheck
      - run: pnpm check:skills
      - run: pnpm check:preset-browser
      - run: pnpm check:core-browser
      - run: pnpm test --maxWorkers=2

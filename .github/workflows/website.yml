name: Deploy installation website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare deployment configuration
        env:
          INSTALLATION_CONFIG: ${{ secrets.MEARL_INSTALLATION_CONFIG }}
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(process.env.RUNNER_TEMP + "/installation.json", process.env.INSTALLATION_CONFIG || "{\"schemaVersion\":1}", { mode: 0o600 });'
      - run: pnpm build:website
        env:
          GH_TOKEN: ${{ github.token }}
          MEARL_INSTALLATION_CONFIG_FILE: ${{ runner.temp }}/installation.json
      - run: pnpm --filter @mearl/website typecheck
      - run: pnpm --filter @mearl/website test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

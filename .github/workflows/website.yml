name: Deploy installation website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/website.yml'
      - 'packages/website/**'
      - 'packages/preset/**'
      - 'packages/extension/package.json'
      - 'packages/extension/README*.md'
      - 'packages/client/README*.md'
      - 'packages/mcp-server/README*.md'
      - 'packages/provider/README*.md'
      - 'packages/setup/README*.md'
      - 'skills/README*.md'
      - 'docs/capability-model*.md'
      - '.npmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'vitest.shared.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:website
        env:
          GH_TOKEN: ${{ github.token }}
          MEARL_INSTALLATION_CONFIG: ${{ secrets.MEARL_INSTALLATION_CONFIG }}
      - run: pnpm --filter @mearl/website typecheck
      - run: pnpm --filter @mearl/website test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
